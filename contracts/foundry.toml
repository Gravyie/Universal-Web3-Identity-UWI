[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
# Hedera supports Cancun opcodes (MCOPY is used by OpenZeppelin 5.x).
evm_version = "cancun"
optimizer = true
optimizer_runs = 500
via_ir = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
hedera_testnet = "https://testnet.hashio.io/api"
