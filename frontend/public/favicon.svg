<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    g, circle.dot { stroke: #fff; fill: none; }
    circle.dot { fill: #fff; stroke: none; }
    @media (prefers-color-scheme: light) {
      g { stroke: #111114; }
      circle.dot { fill: #111114; }
    }
  </style>
  <g stroke-width="3.6">
    <circle cx="32" cy="32" r="27"/>
    <ellipse cx="32" cy="32" rx="27" ry="10.7"/>
    <ellipse cx="32" cy="32" rx="27" ry="10.7" transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="27" ry="10.7" transform="rotate(-60 32 32)"/>
  </g>
  <circle class="dot" cx="32" cy="32" r="5"/>
</svg>
